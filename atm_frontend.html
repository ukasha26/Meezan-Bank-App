<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meezan Bank ATM - Frontend</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(to bottom, #800080, #008000); color: white; text-align: center; padding: 50px; }
        .atm { background: #333; padding: 20px; border-radius: 10px; display: inline-block; }
        input { margin: 10px; padding: 10px; }
        button { padding: 10px 20px; background: #008000; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Meezan Bank ATM</h1>
    <div class="atm">
        <h2>Insert Card & Enter Details</h2>
        <form id="atmForm">
            <input type="text" id="account" placeholder="Account Number" required><br>
            <input type="password" id="pin" placeholder="PIN" required><br>
            <input type="number" id="amount" placeholder="Withdrawal Amount" required><br>
            <button type="submit">Withdraw</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('atmForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const account = document.getElementById('account').value;
            const pin = document.getElementById('pin').value;
            const amount = document.getElementById('amount').value;

            try {
                const response = await fetch('http://localhost:8000/atm_backend.php', { // Assuming backend runs on localhost:8000
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ account, pin, amount: parseFloat(amount) })
                });
                const result = await response.json();
                document.getElementById('result').innerHTML = `<p>${result.message}</p>` +
                    (result.success ? `<p>New Balance: ${result.new_balance}</p><p>Dispensed: ${result.dispensed}</p>` : '');
            } catch (error) {
                document.getElementById('result').innerHTML = '<p>Error connecting to backend.</p>';
            }
        });
    </script>
</body>
</html>
